name: Vela CI

on:
  push:
    branches:
      - master
      - modernize-ui
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x64

      - name: Build tests with MSBuild
        run: >
          msbuild source/BulkCrapUninstallerTests/BulkCrapUninstallerTests.csproj /restore /t:Build /v:minimal
          /p:Configuration=Release /p:Platform=x64 /p:GenerateSatelliteAssembliesForCore=true

      - name: Run tests
        run: >
          dotnet test source/BulkCrapUninstallerTests/BulkCrapUninstallerTests.csproj
          --configuration Release --no-build --no-restore -p:Platform=x64
          --logger "trx;LogFileName=BulkCrapUninstallerTests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Package Windows x64 release
        run: ./installer/Build-Vela.ps1

      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vela-win-x64
          path: bin/vela-release/
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.repository == 'fengzhouxuan/Bulk-Crap-Uninstaller' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vela-win-x64
          path: release

      - name: Verify and publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          base="Vela_${version}_win-x64"
          test -f "${base}_setup.exe"
          test -f "${base}_portable.zip"
          sha256sum --check SHA256SUMS.txt
          if existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null); then
            jq -e --arg setup "${base}_setup.exe" --arg portable "${base}_portable.zip" '
              (.isDraft | not) and ([.assets[].name] as $assets
                | all($setup, $portable, "SHA256SUMS.txt"; . as $file | $assets | index($file) != null))
            ' <<< "$existing" > /dev/null
            echo "Release $GITHUB_REF_NAME is already published with all expected files."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "${base}_setup.exe" "${base}_portable.zip" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "Vela $version" --notes "Windows x64 installer and portable ZIP with the .NET runtime included. The binaries are unsigned. SHA256SUMS.txt contains both package checksums."
